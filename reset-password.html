
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Blizzy Digitals</title>
  <link rel="stylesheet" href="updates-feature.css">
</head>
<body>
  <main class="updates-container">
    <h1>Blizzy Digitals</h1>
    <h2>Reset your password</h2>
    <p>Choose a new password for your admin account.</p>

    <form id="reset-form">
      <label for="new-password">New password</label>
      <input id="new-password" type="password"
        autocomplete="new-password" minlength="8" required>

      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password"
        autocomplete="new-password" minlength="8" required>

      <button type="submit">Save new password</button>
    </form>

    <p id="reset-message" role="status"></p>
    <p><a href="admin.html">Return to admin sign-in</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const client = window.supabase.createClient(
      window.BLIZZY_SUPABASE_URL,
      window.BLIZZY_SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("reset-form");
    const message = document.getElementById("reset-message");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const password = document.getElementById("new-password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      if (password !== confirmPassword) {
        message.textContent = "The passwords do not match.";
        return;
      }

      message.textContent = "Checking recovery link...";

      const { data, error: sessionError } = await client.auth.getSession();

      if (sessionError || !data.session) {
        message.textContent =
          "This recovery link is invalid or expired. Request a new password recovery email.";
        return;
      }

      const { error } = await client.auth.updateUser({
        password: password
      });

      if (error) {
        message.textContent = "Password update failed. Please request a new recovery email.";
        return;
      }

      message.textContent =
        "Password changed successfully. You can now return to admin sign-in.";
      form.reset();
    });
  </script>
</body>
</html>
